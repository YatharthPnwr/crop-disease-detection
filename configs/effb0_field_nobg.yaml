# effb0_field_nobg: same model and schedule as effb0.yaml, trained on lab + field images without background swap (ablation).
# EfficientNet-B0 (ImageNet) with two-phase fine-tuning.
model: efficientnet_b0
dropout: 0.2
phases:
  - name: head            # phase 1: backbone frozen (BN in eval mode), train the new head
    epochs: 2
    head_lr: 1.0e-3
    backbone_lr: 0.0
    freeze_backbone: true
    warmup_epochs: 0
    schedule: constant
  - name: full            # phase 2: everything trainable, 10x lower LR on the backbone
    epochs: 8
    head_lr: 1.0e-3
    backbone_lr: 1.0e-4
    freeze_backbone: false
    warmup_epochs: 1

# Lab + field training: PlantVillage plus PlantDoc leaf crops (configs/*_field.yaml)
split: combined_split.csv
data:
  domain_weights: {plantvillage: 1.0, plantdoc: 2.0}   # oversample the small field set
  bg_swap: 0.0                                         # paste lab leaves onto field backgrounds
train:
  select_metric: domain_mean_f1   # checkpoint = best mean of lab and field val macro-F1
